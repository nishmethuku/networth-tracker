name: Keep Backend Awake

# Render's free tier puts the backend to sleep after about 15 minutes with no traffic, and the
# first visit after that waits around 40 seconds. A light request every 10 minutes keeps it awake.
# Uses the same BACKEND_URL repo secret as the other workflows. One free instance has 750 hours a
# month, which covers a full month (about 744 hours) if it is the only service on the account.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the backend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "${{ secrets.BACKEND_URL }}/health" || true)
          echo "Health check returned: $status"
