name: CI

# Runs the full test suite (and a production build, to catch anything
# tests wouldn't) on every push and pull request against main — separate
# from the other workflows in this directory, which are scheduled crons
# that operate on the deployed app rather than testing the codebase.
# Every job here runs against mocked/pure-function tests only (e2e-tests
# mocks the backend and Supabase auth at the network/localStorage level —
# see frontend/e2e/fixtures.ts), so none of it needs real Supabase/
# database credentials.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend/
      - name: Run pytest
        run: python -m pytest backend/ -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Check for hardcoded strings (i18n coverage, informational)
        # Only 6 of ~50 component files use react-i18next today. This is a
        # soft signal for follow-up work, not a gate: real JSX-text
        # detection needs a parser, and this app has legitimate English-only
        # surfaces (currency codes, ticker symbols, formatted numbers) that
        # a plain grep can't tell apart from real UI copy. continue-on-error
        # keeps it from ever failing the build.
        continue-on-error: true
        run: |
          grep -rL "useTranslation" src/components/ --include="*.jsx" \
            | xargs grep -n '>[A-Z][a-zA-Z ,'"'"'"-]\{2,\}<' 2>/dev/null \
            | grep -v -E '\{t\(|//' \
            | head -40 || true
      - name: Run vitest
        run: npx vitest run
      - name: Production build
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
