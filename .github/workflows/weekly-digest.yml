name: Weekly Net Worth Digest

# Runs once a week and hits the backend's /internal/weekly-digest endpoint,
# which computes (but does not yet email) a net worth summary per user and
# household. Email delivery is stubbed until a provider (Resend/SendGrid/SES)
# is configured — this cron is harmless to run in the meantime.
# Requires the same two repo secrets as daily-snapshot.yml:
#   BACKEND_URL      e.g. https://networth-tracker.onrender.com
#   SNAPSHOT_SECRET   must match the backend's SNAPSHOT_SECRET env var

on:
  schedule:
    - cron: "0 13 * * 1" # 13:00 UTC every Monday
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly digest
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ secrets.BACKEND_URL }}/internal/weekly-digest" \
            -H "X-Snapshot-Secret: ${{ secrets.SNAPSHOT_SECRET }}")
          echo "Response ($status):"
          cat /tmp/response.json
          if [ "$status" != "200" ]; then
            echo "Weekly digest request failed with status $status"
            exit 1
          fi
