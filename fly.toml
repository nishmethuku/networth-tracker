# Fly.io configuration
# Run: fly launch (creates this automatically) or fly deploy

app = "networth-tracker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_APP = "backend.app"
  PYTHONPATH = "/app"
  PORT = "5001"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
