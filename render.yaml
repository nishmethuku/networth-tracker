services:
  - type: web
    name: networth-tracker-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Supabase connection string (Session pooler)
      - key: SUPABASE_URL
        sync: false
      - key: SNAPSHOT_SECRET
        sync: false # must match the GitHub Actions repo secret of the same name
      - key: FINNHUB_API_KEY
        sync: false
      - key: METALS_API_KEY
        sync: false # free key from metals-api.com, for gold/silver/platinum prices
      - key: RESEND_API_KEY
        sync: false # free key from resend.com, for digest/alert/milestone emails
      - key: GEMINI_API_KEY
        sync: false # optional, free — powers the AI copilot chat, digest narrative, allocation advisor, categorizer, and search. Get one at aistudio.google.com
      - key: AI_PROVIDER
        sync: false # optional: "gemini" (default) or "openai"
      - key: OPENAI_API_KEY
        sync: false # optional, only when AI_PROVIDER=openai. OPENAI_MODEL picks the model (default gpt-4o-mini).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # optional: lets "Delete my account" in Settings also remove the login. A powerful secret; never put it in the frontend.
      - key: TRUSTED_PROXY_COUNT
        sync: false # optional: how many proxies to trust in X-Forwarded-For when reading the visitor's address (default 2 in production).
      - key: SUPABASE_JWT_ISSUER
        sync: false # optional: only needed with a custom Supabase auth domain. Default is SUPABASE_URL + /auth/v1.
      - key: FRONTEND_URL
        sync: false # your Vercel deployment URL, e.g. https://networth-tracker.vercel.app
      - key: SENTRY_DSN
        sync: false # optional, free — error tracking (sentry.io). Unset = no-op, nothing breaks.
      - key: REDIS_URL
        sync: false # optional — shared rate-limit storage across gunicorn's 2 worker processes. Unset = falls back to in-memory (approximate across workers).
      - key: VAPID_PUBLIC_KEY
        sync: false # optional, free — enables push notifications for alerts. Generate per backend/.env.example; must match the frontend's VITE_VAPID_PUBLIC_KEY exactly (not a secret). Unset = push unavailable, alerts still email.
      - key: VAPID_PRIVATE_KEY
        sync: false # pairs with VAPID_PUBLIC_KEY above — this one IS a secret.
      - key: VAPID_SUBJECT
        sync: false # a mailto: or https: URL identifying who's sending the push, per the Web Push spec — e.g. mailto:you@example.com
